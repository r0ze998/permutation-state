[package]
name = "permutation-rules"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Deterministic rules engine for PERMUTATION STATE (Rules Specification v0.2, Game Design V5)"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# Pinned to match permutation-state-solana-receipt-spike so the crate can be
# linked into the ER program without a second borsh version.
borsh = { version = "=1.6.1", default-features = false, features = ["derive"] }
sha2 = { version = "=0.10.9", default-features = false }

[features]
default = []
std = ["borsh/std", "sha2/std"]
# Compute-unit probes on Solana (measurement builds only; see `probe`).
cu-trace = []

# On Solana, hash with the runtime's sol_sha256 syscall (bit-identical, far
# cheaper in compute units than hashing in SBF code).
[target.'cfg(target_os = "solana")'.dependencies]
solana-define-syscall = "=4.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
