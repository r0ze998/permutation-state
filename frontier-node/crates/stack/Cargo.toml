[package]
name = "stack"
description = "Frontier local stack orchestrator: check-ports, up (Mode A), verify, tamper, load, report, down (M1 contract §8.7, §10.3, §12, §13.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "frontier_stack"
path = "src/lib.rs"

[[bin]]
name = "frontier-stack"
path = "src/main.rs"

[dependencies]
fclient.workspace = true
frontier-abi.workspace = true
permutation-rules.workspace = true
verify = { path = "../verify" }
tokio.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
# The keeper's own parser checks the keeper.toml the stack writes (W5-B R1).
keeper = { path = "../keeper" }
