[package]
name = "stack"
description = "Frontier local stack orchestrator: check-ports, up (Mode A), verify, tamper, load, report, down (M1 contract §8.7, §10.3, §12, §13.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "frontier_stack"
path = "src/lib.rs"

[[bin]]
name = "frontier-stack"
path = "src/main.rs"

# Dependency sections belong to the integrator (contract §3.4, I-55). W5-B
# request R1 (docs/frontier/m1/W5-B-NOTES.md): workspace crates and crates
# already in frontier-node/Cargo.lock only; no new external crate.
[dependencies]
fclient.workspace = true
frontier-abi.workspace = true
permutation-rules.workspace = true
verify = { path = "../verify" }
tokio.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
# The keeper's own parser checks the keeper.toml the stack writes.
keeper = { path = "../keeper" }
