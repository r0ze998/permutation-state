# The Frontier off-chain workspace (M1 contract §3.1, §8): client spine,
# local chain node, drand replay, keeper, herald, verifier, bots, stack and
# the in-process integration tests. It has its own lock and toolchain
# (1.95.0: LiteSVM 0.16 does not build on 1.89) and is not a member of the
# root workspace. The lock was seeded from the SP-V2 host lock so LiteSVM
# and the Solana crates resolve to the versions the M0 labs measured.
#
# Dependency sections belong to the integrator (contract §3.4, I-55): every
# version below is pinned with `=` and listed in docs/frontier/m1/W1-F-NOTES.md.
[workspace]
resolver = "2"
members = [
    "crates/fclient",
    "crates/findex",
    "crates/keeper",
    "crates/herald",
    "crates/verify",
    "crates/agents",
    "crates/bots",
    "crates/localnet",
    "crates/drand-replay",
    "crates/stack",
    "crates/itest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace.dependencies]
permutation-rules = { path = "../permutation-rules", features = ["std"] }
# The canonical ABI tables (layouts, tags, errors), for fclient's twin test
# (integ-W1, contract §3.3); path only, no new external crate.
frontier-abi = { path = "../frontier-abi" }
fclient = { path = "crates/fclient" }
localnet = { path = "crates/localnet" }
# integ-W3 (W3-D request R1): the herald reads the findex archive and index.
findex = { path = "crates/findex" }

litesvm = "=0.16.0"
solana-account = "=4.3.2"
solana-address = { version = "=2.6.1", features = ["curve25519", "sha2", "decode"] }
solana-clock = "=3.1.1"
solana-hash = "=4.5.0"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-signature = "=3.4.1"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.6", features = ["serde", "wincode", "verify"] }
solana-rent = "=4.3.0"
agave-feature-set = "=4.2.2"

blstrs = "=0.7.1"
group = "=0.13.0"
ark-ff = "=0.5.0"
ark-ec = "=0.5.0"
ark-bls12-381 = "=0.5.0"
tlock = "=0.0.10"

sha2 = "=0.10.9"
hex = "=0.4.3"
bincode = "=1.3.3"
base64 = "=0.22.1"
serde_json = "=1.0.151"
rand = "=0.8.8"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
# W2-F (dependency request R1 in docs/frontier/m1/W2-F-NOTES.md): the keeper
# journal and the findex entity index (contract §3.3 expected set: rusqlite,
# bundled).
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# W2-F (request R2): the native model of the beacon instructions that the
# keeper's in-process tests register as a LiteSVM builtin while the program
# (W2-A) is not on this branch. Test-only; already in this lock through LiteSVM.
solana-program-runtime = "=4.2.2"
# integ-W3 (W3-D request R2): the herald's WebSocket upgrade (hyper's upgrade
# API under axum, no `ws` feature and no tungstenite), already in this lock
# through axum. W3-D request R3 (flate2 for `.gz` siblings) is NOT applied:
# outside the contract's expected dependency set; it waits for the owner.
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
# W4-F request R2 (DECISIONS J2, decided by the main session 2026-09-28):
# the herald's `.gz` siblings (pure-Rust miniz_oxide backend); brotli not
# needed now.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[profile.dev.package."*"]
# The BLS pairing, LiteSVM and tlock are unusably slow unoptimised.
opt-level = 3

[profile.test.package."*"]
opt-level = 3
