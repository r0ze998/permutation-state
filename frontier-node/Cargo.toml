# The Frontier off-chain workspace (M1 contract §3.1, §8): client spine,
# local chain node, drand replay, keeper, herald, verifier, bots, stack and
# the in-process integration tests. It has its own lock and toolchain
# (1.95.0: LiteSVM 0.16 does not build on 1.89) and is not a member of the
# root workspace. The lock was seeded from the SP-V2 host lock so LiteSVM
# and the Solana crates resolve to the versions the M0 labs measured.
#
# Dependency sections belong to the integrator (contract §3.4, I-55): every
# version below is pinned with `=` and listed in docs/frontier/m1/W1-F-NOTES.md.
[workspace]
resolver = "2"
members = [
    "crates/fclient",
    "crates/findex",
    "crates/keeper",
    "crates/herald",
    "crates/verify",
    "crates/agents",
    "crates/bots",
    "crates/localnet",
    "crates/drand-replay",
    "crates/stack",
    "crates/itest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace.dependencies]
permutation-rules = { path = "../permutation-rules", features = ["std"] }
# The canonical ABI tables (layouts, tags, errors), for fclient's twin test
# (integ-W1, contract §3.3); path only, no new external crate.
frontier-abi = { path = "../frontier-abi" }
fclient = { path = "crates/fclient" }
localnet = { path = "crates/localnet" }

litesvm = "=0.16.0"
solana-account = "=4.3.2"
solana-address = { version = "=2.6.1", features = ["curve25519", "sha2", "decode"] }
solana-clock = "=3.1.1"
solana-hash = "=4.5.0"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-signature = "=3.4.1"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.6", features = ["serde", "wincode", "verify"] }
solana-rent = "=4.3.0"
agave-feature-set = "=4.2.2"

blstrs = "=0.7.1"
group = "=0.13.0"
ark-ff = "=0.5.0"
ark-ec = "=0.5.0"
ark-bls12-381 = "=0.5.0"
tlock = "=0.0.10"

sha2 = "=0.10.9"
hex = "=0.4.3"
bincode = "=1.3.3"
base64 = "=0.22.1"
serde_json = "=1.0.151"
rand = "=0.8.8"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }

[profile.dev.package."*"]
# The BLS pairing, LiteSVM and tlock are unusably slow unoptimised.
opt-level = 3

[profile.test.package."*"]
opt-level = 3
