# The M1 exit season (M1 contract §13.4 E5, Gate W7): real rounds, the
# release .so, 20x, 7 days, 1,000 bots, chaos, the adversary schedule,
# 5,000 viewers for 24 game hours.
#
#   frontier-stack up --config frontier-node/configs/m1-exit.toml
#   (= up --mode accel --beacon archive --scale 20 --days 7 --bots 1000 --run-id m1-exit
#      --base-port 41000 --chaos --viewers 5000 --viewer-window-hours 24)
run_id = "m1-exit"
mode = "accel"
beacon = "archive"
scale = 20
preseason_scale = 2000
days = 7
drain_bells = 26
bots = 1000
bot_seed = 11
season_id = 7
base_port = 41000
# W6T-4: keeper B is a delayed backup for the settles (plan U2.8; written
# only to a keeper build that knows the key).
keeper_b_backup_delay_slots = 8
g0 = 1788998400

[paths]
archive = "../../data/drand-archive-quicknet-g0-1788998400"

# M1 exit U4: each keeper's beneficiary signs ClaimDefence and pays its fee
# (§5.12); the stack airdrops it this much at start (the default, 1 SOL =
# 50 x the keeper's per-write spend cap). Unfunded, no claim ever landed.
[pools]
beneficiary_lamports = 1000000000

[chaos]
enabled = true
seed = 11

[adversary]
enabled = true

[viewers]
count = 5000
start_hours = 24
window_hours = 24
# W6T-4 (§13.4 A3): the viewers' recovery budget defaults to the chaos
# restart maximum at the run's scale + 2 s (5,000 ms at 20x); they follow
# the live bell from the herald's /h/status over the opened provinces and
# every ring (frontier-stack passes those at spawn).
think_ms = 5000
follow_status = true
