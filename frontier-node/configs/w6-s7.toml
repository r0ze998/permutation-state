# The first 7-day, 1,000-bot Mode A run (M1 contract §12 Gate W6, §13.4):
# real historical quicknet rounds from the contiguous archive (O-M1-12
# item 3; G0 = 1788998400 = 2026-09-10T00:00:00Z, rounds
# 32,065,012..=32,311,012), the release .so, 20x (7 game days in 8.4 h),
# chaos, the adversary schedule and 5,000 viewers for one game day.
# The archive is complete (manifest.json, 2026-09-28); an unfinished one
# answers PENDING (exit 4). The Gate W6 line itself names no --config (and
# no --adversary): scripts/m1-run-s7.sh runs that line with the release
# build's --expect-so-sha256; this file is the same run with the adversary
# schedule on.
run_id = "w6-s7"
mode = "accel"
beacon = "archive"
scale = 20
preseason_scale = 2000
days = 7
drain_bells = 26
bots = 1000
bot_seed = 7
season_id = 7
base_port = 41000
# W6T-4: keeper B is a delayed backup for the settles (plan U2.8; written
# only to a keeper build that knows the key).
keeper_b_backup_delay_slots = 8
g0 = 1788998400

[paths]
# From a worktree under .claude/worktrees/ (the archive lives outside the
# repository and is never committed); override with --archive DIR.
archive = "../../data/drand-archive-quicknet-g0-1788998400"

[chaos]
enabled = true
seed = 7

[adversary]
enabled = true

[viewers]
count = 5000
start_hours = 24              # day 1 (every bot has joined by then)
window_hours = 24
# W6T-4 (§13.4 A3): the viewers' recovery budget defaults to the chaos
# restart maximum at the run's scale + 2 s (5,000 ms at 20x); they follow
# the live bell from the herald's /h/status over the opened provinces and
# every ring (frontier-stack passes those at spawn).
think_ms = 5000
follow_status = true
