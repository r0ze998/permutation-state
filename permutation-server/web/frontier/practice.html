<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#243e38">
  <title data-i18n>練習モード — 六重の辺境</title>
  <link rel="stylesheet" href="frontier.css">
</head>
<body data-mode="practice">
<header class="topbar">
  <a class="brand" href="./" aria-label="六重の辺境" data-i18n-attr="aria-label"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 100 100" width="26" height="26" class="emblem" aria-hidden="true" focusable="false"><circle cx="50" cy="50" r="46" fill="none" stroke="#d9b44a" stroke-width="1.4" opacity=".85"/><circle cx="50" cy="50" r="34" fill="none" stroke="#d9b44a" stroke-width="0.8" stroke-dasharray="2 3" opacity=".7"/><path d="M50 30 C41 30 38 38 38 46 L37 56 L33 61 L67 61 L63 56 L62 46 C62 38 59 30 50 30 Z" fill="#d9b44a" stroke="#7a5a14" stroke-width="1.4"/><path d="M44 62 C44 66 56 66 56 62 Z" fill="#7a5a14"/><circle cx="50" cy="27.5" r="2.6" fill="#7a5a14"/><g transform="translate(50.00 16.00)"><circle r="9.5" fill="#fffaf0" stroke="#7d2c27" stroke-width="1.8"/><path d="M -5.40 0 A 5.40 5.40 0 1 0 5.40 0 A 5.40 5.40 0 1 0 -5.40 0 Z" fill="#c1504a"/></g><g transform="translate(79.44 33.00)"><circle r="9.5" fill="#fffaf0" stroke="#1b5a53" stroke-width="1.8"/><path d="M 0 -5.67 L 5.40 4.32 L -5.40 4.32 Z" fill="#2f8f84"/></g><g transform="translate(79.44 67.00)"><circle r="9.5" fill="#fffaf0" stroke="#7d5a14" stroke-width="1.8"/><path d="M -4.59 -4.59 H 4.59 V 4.59 H -4.59 Z" fill="#c28f2c"/></g><g transform="translate(50.00 84.00)"><circle r="9.5" fill="#fffaf0" stroke="#4b3874" stroke-width="1.8"/><path d="M 0 -5.94 L 5.40 0 L 0 5.94 L -5.40 0 Z" fill="#7a5fb0"/></g><g transform="translate(20.56 67.00)"><circle r="9.5" fill="#fffaf0" stroke="#24497b" stroke-width="1.8"/><path d="M -1.78 -5.40 H 1.78 V -1.78 H 5.40 V 1.78 H 1.78 V 5.40 H -1.78 V 1.78 H -5.40 V -1.78 H -1.78 Z" fill="#3f78c2"/></g><g transform="translate(20.56 33.00)"><circle r="9.5" fill="#fffaf0" stroke="#6f2d4c" stroke-width="1.8"/><path d="M -2.70 -4.70 H 2.70 L 5.40 0 L 2.70 4.70 H -2.70 L -5.40 0 Z" fill="#b5527f"/></g></svg></span><span data-i18n>六重の辺境</span></a>
  <span class="chip" id="faction-chip" hidden></span>
  <span class="res-strip" id="res-strip" hidden></span>
  <span class="bell-pill" id="bell-pill" data-urgency="calm"><span class="chip bell-chip" id="bell-chip" aria-live="off">—</span><span class="bell-bar" aria-hidden="true"><span class="bell-fill" id="bell-fill"></span></span></span>
  <button type="button" class="chip attn-pill" id="attn-pill" data-act="attn" hidden></button>
  <span class="chip" id="quota-chip" hidden></span>
  <span class="lang-box" id="lang-box"></span>
</header>
<p class="banner" id="stale-banner" role="status" hidden></p>
<p class="banner error" id="error-line" role="alert" hidden></p>
<main id="frontier">
  <h1 class="visually-hidden" data-i18n>辺境の地図</h1>
  <aside class="rail" id="rail" aria-label="拠点と行動" data-i18n-attr="aria-label"></aside>
  <canvas id="frontier-map" tabindex="0" aria-label="辺境の地図：矢印キーで移動、＋と－で拡大縮小、Enter で中央の州を選択" aria-describedby="map-summary" data-i18n-attr="aria-label"></canvas>
  <p class="map-summary" id="map-summary" aria-live="polite"></p>
  <div class="map-tip" id="map-tip" role="tooltip" hidden></div>
  <div class="feed" id="feed" aria-live="polite"></div>
  <p class="bell-toll" id="bell-toll" aria-hidden="true"></p>
  <form class="map-search" id="map-search" role="search" data-form="map-search">
    <input type="search" id="map-search-q" name="q" autocomplete="off" placeholder="州・勢力・領主を探す" aria-label="地図を探す（州の座標、勢力、領主の名前）" data-i18n-attr="placeholder aria-label">
    <div class="search-results" id="map-search-results"></div>
  </form>
  <div class="minimap" id="minimap">
    <div class="lenses" id="lenses" role="group" aria-label="レンズ" data-i18n-attr="aria-label"></div>
    <canvas id="minimap-canvas" role="img" aria-label="世界の小さな地図：押すとその場所へ移動します" data-i18n-attr="aria-label"></canvas>
  </div>
  <section class="panel" id="panel" aria-labelledby="panel-title">
    <h2 id="panel-title" data-i18n>練習モード</h2>
    <p id="season-status">—</p>
    <div id="panel-body"></div>
  </section>
</main>
<nav class="tabs" aria-label="画面" data-i18n-attr="aria-label">
  <a class="tab" href="./"><span data-i18n>地図</span></a>
  <a class="tab" href="practice.html" aria-current="page"><span data-i18n>練習</span></a>
  <a class="tab" href="spectate.html"><span data-i18n>観戦</span></a>
</nav>
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" hidden></div>
<script type="module" src="app.mjs"></script>
</body>
</html>
