<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#243e38">
  <title data-i18n>観戦 — Wylls</title>
  <link rel="stylesheet" href="frontier.css">
</head>
<body data-mode="spectate">
<header class="topbar">
  <a class="brand" href="./" aria-label="Wylls" data-i18n-attr="aria-label"><span class="brand-mark" aria-hidden="true">✳</span><span data-i18n>Wylls</span></a>
  <span class="chip" id="faction-chip" hidden></span>
  <span class="res-strip" id="res-strip" hidden></span>
  <span class="bell-pill" id="bell-pill" data-urgency="calm"><span class="chip bell-chip" id="bell-chip" aria-live="off">—</span><span class="bell-bar" aria-hidden="true"><span class="bell-fill" id="bell-fill"></span></span></span>
  <button type="button" class="chip attn-pill" id="attn-pill" data-act="attn" hidden></button>
  <span class="chip" id="quota-chip" hidden></span>
  <span class="lang-box" id="lang-box"></span>
</header>
<p class="banner" id="stale-banner" role="status" hidden></p>
<p class="banner error" id="error-line" role="alert" hidden></p>
<main id="frontier">
  <h1 class="visually-hidden" data-i18n>辺境の地図</h1>
  <aside class="rail" id="rail" aria-label="拠点と行動" data-i18n-attr="aria-label"></aside>
  <canvas id="frontier-map" tabindex="0" aria-label="辺境の地図：矢印キーで移動、＋と－で拡大縮小、Enter で中央の州を選択" aria-describedby="map-summary" data-i18n-attr="aria-label"></canvas>
  <p class="map-summary" id="map-summary" aria-live="polite"></p>
  <section class="panel" id="panel" aria-labelledby="panel-title">
    <h2 id="panel-title" data-i18n>観戦</h2>
    <p id="season-status">—</p>
    <div id="panel-body"></div>
  </section>
</main>
<nav class="tabs" aria-label="画面" data-i18n-attr="aria-label">
  <a class="tab" href="./"><span data-i18n>地図</span></a>
  <a class="tab" href="practice.html"><span data-i18n>練習</span></a>
  <a class="tab" href="spectate.html" aria-current="page"><span data-i18n>観戦</span></a>
</nav>
<script type="module" src="app.mjs"></script>
</body>
</html>
