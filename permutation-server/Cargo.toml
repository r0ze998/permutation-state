[package]
name = "permutation-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Local game server, bots and replay recorder for Wylls"
license = "MIT"
publish = false

[dependencies]
permutation-rules = { path = "../permutation-rules", features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
borsh = { version = "=1.6.1", features = ["derive"] }
# Account layouts (Season) for the replay verifier; no program entrypoint.
permutation-chain = { path = "../permutation-chain", features = ["no-entrypoint"] }
