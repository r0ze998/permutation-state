[package]
name = "permutation-chain"
version = "0.1.0"
edition = "2021"
publish = false
description = "Solana / MagicBlock ER program that runs the permutation-rules engine on chain"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["custom-heap", "program"]
# The on-chain program (processor, entrypoint, MagicBlock SDK). Without it the
# crate is the account layouts and pure modules only (tests, server, verifier).
program = ["dep:ephemeral-rollups-sdk", "dep:solana-system-interface"]
no-entrypoint = []
custom-heap = []
custom-panic = []
# Log the compute units left at each step of ResolveTick (measurement builds only).
cu-trace = ["permutation-rules/cu-trace"]
# Measurement builds only: the heap allocator keeps its high-water mark (`heap::peak`).
heap-trace = []
# Local stacks without a VRF oracle: tick and season randomness drawn in the
# transaction (flagged `RAND_DEV` / `SEED_DEV`; the verifier refuses them on
# devnet, testnet and mainnet). Never a deployed build.
dev-randomness = []
# Mainnet builds: CreateSeason admits only Circle USDC (`token::USDC_MAINNET`).
mainnet = []
# Host tests of the processor: `processor::now()` reads a settable clock
# (`set_host_clock`) instead of the Clock sysvar.
host-clock = []

[dependencies]
# Same pins as permutation-state-solana-receipt-spike (MagicBlock's Native Rust
# example); upgrading them is an explicit compatibility task.
borsh = { version = "=1.6.1", features = ["derive"] }
ephemeral-rollups-sdk = { version = "=0.16.2", optional = true }
solana-program = "=4.0.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"], optional = true }
permutation-rules = { path = "../permutation-rules" }
