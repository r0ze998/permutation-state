[package]
name = "permutation-chain"
version = "0.1.0"
edition = "2021"
publish = false
description = "Solana / MagicBlock ER program that runs the permutation-rules engine on chain"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["custom-heap"]
no-entrypoint = []
custom-heap = []
custom-panic = []
# Log the compute units left at each step of ResolveTick (measurement builds only).
cu-trace = ["permutation-rules/cu-trace"]

[dependencies]
# Same pins as permutation-state-solana-receipt-spike (MagicBlock's Native Rust
# example); upgrading them is an explicit compatibility task.
borsh = { version = "=1.6.1", features = ["derive"] }
ephemeral-rollups-sdk = "=0.16.2"
solana-program = "=4.0.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
permutation-rules = { path = "../permutation-rules" }
