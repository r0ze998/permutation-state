[package]
name = "permutation-state-receipt"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal Solana receipt program for the Wylls Worksite proof"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
# Pinned to the versions used by MagicBlock's current Native Rust counter
# example. Upgrading these is an explicit compatibility task, not a routine
# dependency refresh.
borsh = { version = "=1.6.1", features = ["derive"] }
ephemeral-rollups-sdk = "=0.16.2"
solana-program = "=4.0.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
