[package]
name = "permutation-frontier-svm-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Program-level tests of the Sixfold Frontier: the SBPF v2 build of permutation-frontier run in LiteSVM with SIMD-0186 loaded-data enforcement (M1 contract §3.5, §11 W2-B, §13)"

# Its own workspace, lock and toolchain (1.95.0: LiteSVM 0.16 does not build
# on 1.89), excluded from the root workspace (contract §3.1). The program is
# tested as a binary (`PSF_SO`); the Rust crates linked here are the ABI
# (layouts, tags, errors, account lists, budgets), the off-chain spine
# (builders, beacons and the test key, seals, PS2 records, fees) and the
# kernels (native oracles).
[workspace]

# Dependency section: owned by the integrator (contract §3.4, I-55); every
# version pinned with `=` and listed in docs/frontier/m1/W2-B-NOTES.md. The
# versions are frontier-node's (its lock was seeded from the SP-V2 host lock).
[dependencies]
litesvm = "=0.16.0"
solana-account = "=4.3.2"
solana-address = { version = "=2.6.1", features = ["curve25519", "sha2", "decode"] }
solana-clock = "=3.1.1"
solana-hash = "=4.5.0"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-rent = "=4.3.0"
solana-signature = "=3.4.1"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.6", features = ["serde", "wincode", "verify"] }
frontier-abi = { path = "../../frontier-abi" }
fclient = { path = "../../frontier-node/crates/fclient" }
permutation-rules = { path = "../../permutation-rules", features = ["std"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
base64 = "=0.22.1"
bincode = "=1.3.3"
serde_json = "=1.0.151"

# LiteSVM, the pairing and the kernels optimised; the tests stay debug.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
