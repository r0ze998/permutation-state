name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Browser source smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check permutation-state-prototype/app.js
          node --check permutation-state-prototype/proof/core.js
          node --check permutation-state-prototype/proof/app.js
      - name: Validate recorded proof result
        run: python3 -m json.tool permutation-state-prototype/proof/qa-proof-result.json >/dev/null

  receipt-tests:
    name: Solana receipt scaffold tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: permutation-state-solana-receipt-spike
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: permutation-state-solana-receipt-spike/package-lock.json
      - name: Run Rust tests
        run: cargo test --locked
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Run adapter tests
        run: npm test
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate
